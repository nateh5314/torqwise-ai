<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101113">
<meta name="robots" content="noindex,nofollow">
<title>You're offline | TORQWISE</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#191b1f;--line:#30333a;--text:#f4f4f5;--muted:#b7bac2;--red:#ef343b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(560px,100%);padding:clamp(24px,6vw,40px);border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:2px}.brand img{width:42px;height:42px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:6px 10px;border:1px solid #555; border-radius:999px;color:var(--muted);font-size:13px}
h1{font-size:clamp(28px,6vw,38px);line-height:1.15;margin:18px 0 12px}p{color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button,a{min-height:46px;padding:12px 16px;border-radius:9px;font:inherit;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button{border:0;background:var(--red);color:white;cursor:pointer}a{border:1px solid var(--line);color:var(--text)}
:focus-visible{outline:3px solid #ff777c;outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="brand"><img src="./icon.svg" alt=""> TORQWISE</div>
<div class="status"><span aria-hidden="true">●</span> Connection unavailable</div>
<h1>You're offline right now.</h1>
<p>TORQWISE couldn't reach the website. Check your connection and try again. Your saved account and research data may require a connection to load.</p>
<div class="actions"><button type="button" id="retry">Try again</button><a href="./">Return to TORQWISE</a></div>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>
document.getElementById('retry').addEventListener('click',async function(){
 const message=document.getElementById('message');
 message.textContent='Checking connection…';
 try { const response=await fetch('./',{cache:'no-store'}); if(!response.ok)throw new Error(); location.href='./'; }
 catch { message.textContent='Still offline. Reconnect to the internet and try again.'; }
});
</script>
</body>
</html>
