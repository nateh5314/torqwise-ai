name: Bundled diagnostic database
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/bundled-diagnostic-database]
jobs:
  build-and-validate-dtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm install
      - name: Build bundled DTC asset
        run: npm run build
      - name: Validate generated database
        run: |
          node --input-type=module -e '
          import { readFileSync, statSync } from "node:fs";
          const path = "assets/dtc-database.json";
          const rows = JSON.parse(readFileSync(path, "utf8"));
          const codes = new Set(rows.map(row => String(row.code).toUpperCase()));
          if (!Array.isArray(rows) || rows.length < 9000 || codes.size < 9000) throw new Error("Bundled DTC dataset is incomplete");
          if (rows.some(row => !/^[PBCU][0-9A-F]{4}$/.test(String(row.code).toUpperCase()) || !row.title || !row.description)) throw new Error("Invalid DTC record");
          console.log(JSON.stringify({ records: rows.length, uniqueCodes: codes.size, bytes: statSync(path).size }));
          '
