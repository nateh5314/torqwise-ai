name: Validate TORQWISE
on:
  pull_request:
    branches: [main]
  push:
    branches: [secure-auth-quotas]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static checks
        run: npm test
