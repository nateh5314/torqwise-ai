name: TORQWISE iPhone app checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app-check.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm install
      - name: Type-check mobile app
        run: npm run typecheck
      - name: Bundle iOS JavaScript for release validation
        run: npx expo export --platform ios --output-dir .expo-export
      - name: Validate Expo configuration
        run: npx expo config --type public