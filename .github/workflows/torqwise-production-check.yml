name: TORQWISE production launch check
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API regression tests
        run: node --test tests/*.test.mjs
      - name: Check Netlify function syntax
        run: |
          for file in netlify/functions/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check inline browser JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          pages = ["index.html", "admin.html", "support.html"]
          with tempfile.TemporaryDirectory() as directory:
              for page in pages:
                  html = pathlib.Path(page).read_text()
                  scripts = re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script\\s*>", html, re.IGNORECASE)
                  for number, script in enumerate(scripts):
                      if not script.strip():
                          continue
                      path = pathlib.Path(directory) / f"{pathlib.Path(page).stem}-{number}.js"
                      path.write_text(script)
                      print(f"Checking inline JavaScript: {page} script {number}")
                      subprocess.run(["node", "--check", str(path)], check=True)
          PY
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health and critical routes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'https://torqwiseauto.netlify.app';
          async function get(path) {
            const response = await fetch(new URL(path, origin), {
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
              headers: { 'user-agent': 'TORQWISE-production-launch-check' }
            });
            console.log(`${response.status} ${path}`);
            assert.equal(response.status, 200, `${path} should return HTTP 200`);
            return response;
          }
          const homepage = await (await get('/')).text();
          assert.match(homepage, /TORQWISE/i);
          for (const marker of ['diagnostics', 'research-hub', 'parts-market', 'vin-lookup']) {
            assert.ok(homepage.includes(marker), `Homepage missing feature marker: ${marker}`);
          }
          for (const marker of ['torqFitmentBrand', 'torqFitmentType', "brand:document.getElementById('torqFitmentBrand')", "partType:document.getElementById('torqFitmentType')"]) {
            assert.ok(homepage.includes(marker), `Fitment search missing brand/category support: ${marker}`);
          }
          for (const path of ['/privacy.html', '/terms.html', '/support.html']) {
            assert.match(await (await get(path)).text(), /<html[\s>]/i);
          }
          const health = await (await get('/.netlify/functions/health')).json();
          console.log('Health summary:', JSON.stringify({
            configured: health.configured,
            environment: health.environment,
            checks: health.checks,
            deployContext: health.deployContext,
            commitRef: health.commitRef
          }));
          assert.equal(health.configured, true, 'Supabase public config must be present');
          assert.equal(health.environment?.supabaseServiceRoleKey, true, 'Supabase service role key missing');
          assert.equal(health.environment?.openaiApiKey, true, 'OpenAI API key missing');
          assert.equal(health.checks?.usageTable, 'ready', 'research_usage table check failed');
          assert.equal(health.checks?.quotaFunction, 'reachable', 'research quota RPC check failed');
          const config = await (await get('/.netlify/functions/public-config')).json();
          assert.equal(config.configured, true);
          const dtc = await (await get('/assets/dtc-database.json')).json();
          assert.ok(Array.isArray(dtc) && dtc.length >= 9000, `Expected >=9000 DTCs; got ${dtc?.length}`);
          const codes = new Set(dtc.map(row => row.code));
          for (const code of ['P0300', 'P0420', 'P0171']) assert.ok(codes.has(code), `Missing ${code}`);
          console.log(`PASS: production checks completed; ${dtc.length} generic DTC records present.`);
          NODE